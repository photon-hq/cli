name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Verify and pack, publish staging, or promote a stored candidate
        type: choice
        options: [dry-run, stage, promote]
        default: dry-run
      staging-version:
        description: Staging version to promote; blank selects the current staging tag
        type: string
        default: ""

jobs:
  stage:
    if: github.event_name == 'push' || inputs.operation == 'dry-run' || inputs.operation == 'stage'
    uses: photon-hq/buildspace/.github/workflows/package-stage.yml@c1fb06e4ae457a8e053642a914bd37b8f5ce9e1b
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      packages: write
      actions: read
      attestations: write
    with:
      package: "@photon-ai/cli"
      registry: https://registry.npmjs.org
      environment: staging
      bun-version: "1.3.13"
      install: bun install --frozen-lockfile
      ci-workflow: ci.yml
      verify: bun run check
      pack: bun scripts/pack-release.ts
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'dry-run' }}

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote' && github.ref == 'refs/heads/main'
    uses: photon-hq/buildspace/.github/workflows/package-promote.yml@c1fb06e4ae457a8e053642a914bd37b8f5ce9e1b
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: read
      id-token: write
    with:
      package: "@photon-ai/cli"
      registry: https://registry.npmjs.org
      environment: production
      staging-version: ${{ inputs.staging-version }}

  release-binaries:
    needs: promote
    if: needs.promote.result == 'success' && needs.promote.outputs.pending == 'true'
    uses: ./.github/workflows/release-binaries.yaml
    permissions:
      contents: write
    with:
      version: ${{ needs.promote.outputs.version }}

  docs-reference:
    needs: promote
    if: needs.promote.result == 'success' && needs.promote.outputs.pending == 'true'
    uses: ./.github/workflows/docs-reference.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.promote.outputs.version }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
