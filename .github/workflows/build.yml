name: Build release files

# Builds the release files of a release candidate once: the npm tarball, the
# standalone binaries for eight platforms, the installers (install.sh and
# install.ps1) and the command reference for the docs, with checksums.txt over
# all of them. Photon's release process downloads exactly these files, runs
# its production test on them and records their SHA-256s; after approval, the
# release workflow publishes them unchanged. Every file gets a GitHub build
# attestation here.
on:
  push:
    branches: [release-candidate]

permissions:
  contents: read

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # prepack runs pnpm check, which ends with the production build.
      - name: Pack
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/photon-ai-cli-$(node -p "require('./package.json').version").tgz"
      - name: Export the command reference
        run: |
          pnpm docs:reference
          cp artifacts/docs-reference.json "$RUNNER_TEMP/release/"
      # The release serves the installers at
      # releases/latest/download/install.sh and install.ps1. Rendered with the
      # production defaults, they install from this repository.
      - name: Render the installers
        run: |
          node scripts/build-installers.mjs production
          cp artifacts/install.sh artifacts/install.ps1 "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90

  binaries:
    name: Standalone binaries
    # Bun's Darwin executables must be signed after compilation, on macOS.
    # The other six targets are cross-compiled here too.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The archives carry the build's THIRD_PARTY_NOTICES.txt.
      - name: Build
        run: |
          pnpm build
          pnpm build:binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
          if-no-files-found: error
          retention-days: 90

  # checksums.txt and the build attestations. No dependency code runs here.
  release-files:
    name: Release files
    needs: [npm, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      - name: Check the file set and write checksums.txt
        working-directory: release-files
        run: |
          export LC_ALL=C
          ls -l
          expected=(
            docs-reference.json
            install.ps1
            install.sh
            photon-darwin-arm64.tar.gz
            photon-darwin-x64.tar.gz
            photon-linux-arm64-musl.tar.gz
            photon-linux-arm64.tar.gz
            photon-linux-x64-musl.tar.gz
            photon-linux-x64.tar.gz
            photon-windows-arm64.zip
            photon-windows-x64.zip
          )
          shopt -s nullglob
          tarballs=(photon-ai-cli-*.tgz)
          test "${#tarballs[@]}" -eq 1 || { echo "::error::Expected one photon-ai-cli-<version>.tgz, got ${#tarballs[@]}: ${tarballs[*]}"; exit 1; }
          others=()
          for file in *; do
            test "$file" = "${tarballs[0]}" || others+=("$file")
          done
          test "${others[*]}" = "${expected[*]}" || { echo "::error::Expected ${expected[*]} besides the tarball, got ${others[*]}"; exit 1; }
          sha256sum -- * > "$RUNNER_TEMP/checksums.txt"
          mv "$RUNNER_TEMP/checksums.txt" checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error
          retention-days: 90
