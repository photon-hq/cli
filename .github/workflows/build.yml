name: Build release files

# Builds the release files of a release candidate once: the npm tarball, the
# standalone binaries for eight platforms, the installers (install.sh and
# install.ps1) and the command reference for the docs, with checksums.txt over
# all of them. Photon's release process downloads exactly these files, runs
# its production test on them and records their SHA-256s; after approval, the
# release workflow publishes them unchanged. Every file gets a GitHub build
# attestation here. A pull request that changes this workflow runs it too,
# without the release files job, so the change is checked before a candidate
# uses it.
on:
  push:
    branches: [release-candidate]
  pull_request:
    branches: [main]
    paths: [.github/workflows/build.yml]

permissions:
  contents: read

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # prepack runs pnpm check, which ends with the production build.
      - name: Pack
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/photon-ai-cli-$(node -p "require('./package.json').version").tgz"
      - name: Export the command reference
        run: |
          pnpm docs:reference
          cp artifacts/docs-reference.json "$RUNNER_TEMP/release/"
      # The release serves the installers at
      # releases/latest/download/install.sh and install.ps1. Rendered with the
      # production defaults, they install from this repository.
      - name: Render the installers
        run: |
          node scripts/build-installers.mjs production
          cp artifacts/install.sh artifacts/install.ps1 "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90

  binaries:
    name: Standalone binaries
    # Bun's Darwin executables must be signed after compilation, on macOS.
    # The other six targets are cross-compiled here too.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The archives carry the build's THIRD_PARTY_NOTICES.txt.
      - name: Build
        run: |
          pnpm build
          pnpm build:binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
          if-no-files-found: error
          retention-days: 90

  # Bun cross-compiles the Windows binaries on macOS above, where they can't
  # run. Each Windows zip runs here, on Windows on its own architecture, before
  # checksums.txt and the attestations exist, so a binary that can't start
  # stops the release.
  windows-binaries:
    name: Windows binary (${{ matrix.arch }})
    needs: binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            os-architecture: X64
          - arch: arm64
            runner: windows-11-arm
            os-architecture: Arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: release-binaries
      - name: Run photon --version and photon --help
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          OS_ARCHITECTURE: ${{ matrix.os-architecture }}
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -ne $env:OS_ARCHITECTURE) {
            Write-Output "::error::This runner's Windows is $architecture, not $env:OS_ARCHITECTURE"
            exit 1
          }
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $directory = Join-Path $env:RUNNER_TEMP photon
          Expand-Archive -LiteralPath "release-binaries/photon-windows-$env:ARCH.zip" -DestinationPath $directory
          $photon = Join-Path $directory photon.exe
          $version = (& $photon --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::photon-windows-$env:ARCH.zip: photon --version exited with $LASTEXITCODE"
            exit 1
          }
          if ($version -ne $expected) {
            Write-Output "::error::photon-windows-$env:ARCH.zip: photon --version printed '$version', expected $expected"
            exit 1
          }
          & $photon --help
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::photon-windows-$env:ARCH.zip: photon --help exited with $LASTEXITCODE"
            exit 1
          }

  # checksums.txt and the build attestations. No dependency code runs here.
  release-files:
    name: Release files
    if: github.event_name == 'push'
    needs: [npm, binaries, windows-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      - name: Check the file set and write checksums.txt
        working-directory: release-files
        run: |
          export LC_ALL=C
          ls -l
          expected=(
            docs-reference.json
            install.ps1
            install.sh
            photon-darwin-arm64.tar.gz
            photon-darwin-x64.tar.gz
            photon-linux-arm64-musl.tar.gz
            photon-linux-arm64.tar.gz
            photon-linux-x64-musl.tar.gz
            photon-linux-x64.tar.gz
            photon-windows-arm64.zip
            photon-windows-x64.zip
          )
          shopt -s nullglob
          tarballs=(photon-ai-cli-*.tgz)
          test "${#tarballs[@]}" -eq 1 || { echo "::error::Expected one photon-ai-cli-<version>.tgz, got ${#tarballs[@]}: ${tarballs[*]}"; exit 1; }
          others=()
          for file in *; do
            test "$file" = "${tarballs[0]}" || others+=("$file")
          done
          test "${others[*]}" = "${expected[*]}" || { echo "::error::Expected ${expected[*]} besides the tarball, got ${others[*]}"; exit 1; }
          sha256sum -- * > "$RUNNER_TEMP/checksums.txt"
          mv "$RUNNER_TEMP/checksums.txt" checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error
          retention-days: 90
