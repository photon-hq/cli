name: Release Binaries

# Build standalone `photon` binaries (no Bun runtime required) and
# attach them to the exact stable Release returned by promotion. Manual
# workflow_dispatch remains available for stable-release rebuilds.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: "Existing release tag to attach binaries to"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            asset: photon-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            asset: photon-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: photon-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            asset: photon-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # macOS runners ship bash 3.2, where errexit ignores a failed [[ ]].
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$REQUESTED_TAG" --repo "$REPOSITORY" --json tagName
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Compile binary
        run: |
          bun -e 'const p = await Bun.file("package.json").json(); p.version = process.env.RELEASE_VERSION; await Bun.write("package.json", JSON.stringify(p, null, 2) + "\n");'
          bun build ./src/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile dist/${{ matrix.asset }}
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}

      - name: Smoke test (native targets only)
        if: matrix.target == 'bun-darwin-arm64' || matrix.target == 'bun-linux-x64'
        run: ./dist/${{ matrix.asset }} --version

      - name: Compute SHA256
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 dist/${{ matrix.asset }} > dist/${{ matrix.asset }}.sha256
          else
            sha256sum dist/${{ matrix.asset }} > dist/${{ matrix.asset }}.sha256
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "dist/${{ matrix.asset }}" \
            "dist/${{ matrix.asset }}.sha256" \
            --clobber
